<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  {% include meta.html %}

  {% include styles.html %}

  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.baseurl }}/feed.xml">
</head>

<body>
<div class="wrapper-masthead">
  <div class="container">
    <header class="masthead">
      <a href="{{ site.baseurl }}/" class="site-avatar"><img alt="{{ site.avatar_alt_text }}" src="{{ site.avatar }}"></a>

      <div class="site-info">
        <p class="site-name"><a href="{{ site.baseurl }}/">{{ site.title }}</a></p>
        <p class="site-description">{{ site.description }}</p>
      </div>

      <nav aria-label="Main navigation">
        {%- for link in site.nav_links -%}
        <a href="{{ site.baseurl }}{{ link.url }}">{{ link.title }}</a>
        {%- endfor -%}
      </nav>
    </header>
  </div>
</div>

<main id="main" class="container">
  {{ content }}
</main>

<div class="wrapper-footer">
  <div class="container">
    <footer class="footer">
      {% include svg-icons.html %}
    </footer>
  </div>
</div>

{% include analytics.html %}
<script src="{{ site.baseurl }}/assets/js/copy-code.js"></script>
</body>

<!--

Scientists discover the world that exists;
Engineers create the world that never was.
~ Theodore von Kármán ~

This page was generated with '{{ site.version }}'.

-->

</html>
