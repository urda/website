---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    Written on {{ page.date | date: "%B %e, %Y" }}
  </div>
</article>

<!-- Pagination -->
<div class="pagination">
  {% if page.previous.url %}
    <a href="{{page.previous.url}}" rel="prev" class="pagination-breadcrumb-left">
      Older Post
      <br>
      ({{ page.previous.title }})
    </a>
  {% endif %}

  {% if page.next.url %}
    <a href="{{page.next.url}}" rel="next" class="pagination-breadcrumb-right">
      Newer Post
      <br>
      ({{ page.next.title }})
    </a>
  {% endif %}
</div>
