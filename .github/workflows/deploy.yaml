name: Deploy urda.com


on:
  push:
    branches:
      - gh-pages


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between
# the run in-progress and latest queued. However, do NOT cancel
# in-progress runs as we want to allow these production deployments
# to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:
  #
  # Gate 1: Lint (calls linting.yaml)
  #
  lint:
    uses: ./.github/workflows/linting.yaml

  #
  # Gate 2: Test (calls testing.yaml)
  #
  test:
    uses: ./.github/workflows/testing.yaml

  #
  # Build (only if lint + test pass)
  #
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      # https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby
      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: 📄 Setup Pages
        uses: actions/configure-pages@v5

      - name: 🔨 Build Site
        run: make jekyll-build
        env:
          JEKYLL_ENV: production

      - name: 🏗 Upload Artifacts
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  #
  # Deploy (only if build succeeds)
  #
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
